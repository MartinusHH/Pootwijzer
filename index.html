    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    @keyframes slideInBottom4 { from { transform: translateY(1rem); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slideInBottom8 { from { transform: translateY(2rem); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .animate-in { animation-fill-mode: both; }
    .fade-in { animation-name: fadeIn; }
    .zoom-in-95 { animation-name: zoomIn; }
    .slide-in-from-bottom-4 { animation-name: slideInBottom4; }
    .slide-in-from-bottom-8 { animation-name: slideInBottom8; }
    
    .duration-300 { animation-duration: 300ms; }
    .duration-500 { animation-duration: 500ms; }
    .duration-700 { animation-duration: 700ms; }
  </style>
</head>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- LOKALE DATABASE (API-VRIJ) ---

        options: {
          size: ['Dwerg', 'Middel', 'Reus'],
          coat: ['Kort', 'Lang/Pluizig'],

          feature: ['Hangoren', 'Staande oren', 'Leeuwenmanen']
        },
        db: [
          { name: 'Hangoordwerg', size: 'Dwerg', coat: 'Kort', color: 'Bruin', feature: 'Hangoren' },
          { name: 'Vlaamse Reus', size: 'Reus', coat: 'Kort', color: 'Bont', feature: 'Staande oren' },
          { name: 'Leeuwenkopje', size: 'Dwerg', coat: 'Lang/Pluizig', color: 'Wit', feature: 'Leeuwenmanen' }
        ]
      },
      vogel: {
        label: 'Vogel', emoji: '🦜', term: 'soort', color: 'emerald',
        labels: { size: 'Grootte', coat: 'Verenkleed', color: 'Kleur', feature: 'Snavel' },
        options: {
          size: ['Klein', 'Middel', 'Groot'],
          coat: ['Glad', 'Pluizig'],

        },
        db: [
          { name: 'Grasparkiet', size: 'Klein', coat: 'Glad', color: 'Groen/Geel', feature: 'Kromme snavel' },
          { name: 'Valkparkiet', size: 'Middel', coat: 'Glad', color: 'Grijs', feature: 'Kuifje' },
          { name: 'Ara', size: 'Groot', coat: 'Glad', color: 'Meerkleurig', feature: 'Kromme snavel' },
          { name: 'Kanarie', size: 'Klein', coat: 'Pluizig', color: 'Groen/Geel', feature: 'Rechte snavel' }
        ]
      },
      cavia: {
        label: 'Cavia', emoji: '🐹', term: 'ras', color: 'amber',
        labels: { size: 'Grootte', coat: 'Vacht', color: 'Kleur', feature: 'Kenmerk' },
        options: {
          size: ['Klein', 'Normaal', 'Groot'],
          coat: ['Gladhaar', 'Borstelhaar', 'Langhaar'],
          color: ['Driekleur', 'Effen', 'Bont'],
          feature: ['Rozetten', 'Korte snuit', 'Hangoortjes']
        },
        db: [
          { name: 'Gladhaar', size: 'Normaal', coat: 'Gladhaar', color: 'Driekleur', feature: 'Hangoortjes' },
          { name: 'Borstelcavia', size: 'Normaal', coat: 'Borstelhaar', color: 'Bont', feature: 'Rozetten' },
          { name: 'Peruvian', size: 'Groot', coat: 'Langhaar', color: 'Effen', feature: 'Korte snuit' }
        ]
      },
      reptiel: {
        label: 'Reptiel', emoji: '🦎', term: 'soort', color: 'purple',
        labels: { size: 'Grootte', coat: 'Huidtype', color: 'Kleur', feature: 'Bouw' },
        options: {
          size: ['Klein', 'Middel', 'Groot'],
          coat: ['Schubben', 'Stekels', 'Schild'],
          color: ['Groen', 'Zandkleur', 'Felgekleurd'],
          feature: ['Met poten', 'Slangachtig', 'Huisje op rug']
        },
        db: [
          { name: 'Baardagaam', size: 'Middel', coat: 'Stekels', color: 'Zandkleur', feature: 'Met poten' },
          { name: 'Luipaardgekko', size: 'Klein', coat: 'Schubben', color: 'Felgekleurd', feature: 'Met poten' },
          { name: 'Landschildpad', size: 'Middel', coat: 'Schild', color: 'Zandkleur', feature: 'Huisje op rug' },
          { name: 'Korenslang', size: 'Groot', coat: 'Schubben', color: 'Felgekleurd', feature: 'Slangachtig' }
        ]
      }
    };

    const VIBES = ['Zonnig Strand 🏖️', 'Magisch Bos 🌲', 'Besneeuwde Bergen 🏔️', 'Ruimte/Melkweg 🌌', 'Onderwaterwereld 🐠', 'Gezellige Huiskamer 🛋️', 'Verjaardagsfeest 🎈'];
    const OBJECTS = ['Kleurrijke Bal 🥎', 'Lekkere Kluif/Vis 🦴', 'Coole Zonnebril 😎', 'Gouden Kroontje 👑', 'Toverstaf 🪄', 'Feesthoedje 🥳', 'Vrolijk Skateboard 🛹'];

    // --- UTILITIES ---
    const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    const calculateAgeAndDiet = (type, birthDateString) => {
      if (!birthDateString) return null;
      const birthDate = new Date(birthDateString);
      const today = new Date();
      let ageInMonths = (today.getFullYear() - birthDate.getFullYear()) * 12 + (today.getMonth() - birthDate.getMonth());
      if (today.getDate() < birthDate.getDate()) ageInMonths--;
      const ageInYears = ageInMonths / 12;

      let humanAge, lifeStage, nextStage, dietAdvice;

      if (type === 'hond') {
        humanAge = ageInYears <= 1 ? Math.round(ageInYears * 15) : (ageInYears <= 2 ? 15 + Math.round((ageInYears - 1) * 9) : 24 + Math.round((ageInYears - 2) * 5));
        if (ageInMonths < 12) { lifeStage = 'Puppy 🍼'; nextStage = 'Volwassen (1j)'; dietAdvice = 'Speciaal puppyvoer voor groei en energie!'; }
        else if (ageInYears < 7) { lifeStage = 'Volwassen 🎾'; nextStage = 'Senior (7j)'; dietAdvice = 'Evenwichtig voer voor een actieve hond.'; }
        else { lifeStage = 'Senior 🛋️'; nextStage = 'Al bereikt!'; dietAdvice = 'Seniorvoer, lichter verteerbaar en goed voor gewrichten.'; }
      } else if (type === 'kat') {
        humanAge = ageInYears <= 1 ? Math.round(ageInYears * 15) : (ageInYears <= 2 ? 15 + Math.round((ageInYears - 1) * 9) : 24 + Math.round((ageInYears - 2) * 4));
        if (ageInMonths < 12) { lifeStage = 'Kitten 🍼'; nextStage = 'Volwassen (1j)'; dietAdvice = 'Kittenvoer vol bouwstoffen voor de groei.'; }
        else if (ageInYears < 7) { lifeStage = 'Volwassen 🐈'; nextStage = 'Senior (7j)'; dietAdvice = 'Compleet voer om fit en gezond te blijven.'; }
        else { lifeStage = 'Senior 🧶'; nextStage = 'Al bereikt!'; dietAdvice = 'Aangepast voer ter ondersteuning van nieren en vitaliteit.'; }
      } else {
        // Generiek voor andere dieren
        humanAge = Math.round(ageInYears * 5); // Grove schatting
        lifeStage = ageInYears < 1 ? 'Jong 🍼' : 'Volwassen 🌟';
        nextStage = 'Ouder';
        dietAdvice = 'Zorg voor een soort-specifiek, uitgebalanceerd dieet met voldoende vers water.';
      }
      return { ageInYears, ageInMonths, humanAge, lifeStage, nextStage, dietAdvice };
    };

    // --- ICONEN ---
    const IconChevronRight = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>;
    const IconChat = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/></svg>;
    const IconClose = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
    const IconEdit = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
    const IconLock = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;

    // --- HOOFD COMPONENT ---
    function App() {
      const [step, setStep] = useState('home'); 
      const [activeTab, setActiveTab] = useState('profiel'); 
      
      const [pets, setPets] = useState({
        hond: { breed: '', birthDate: '', gender: '', photoUrl: null, medicationName: '', weeklyFact: '', weatherChecked: false },
        kat: { breed: '', birthDate: '', gender: '', photoUrl: null, medicationName: '', weeklyFact: '', weatherChecked: false },
        vogel: { breed: '', birthDate: '', gender: '', photoUrl: null, medicationName: '', weeklyFact: '', weatherChecked: false },
        konijn: { breed: '', birthDate: '', gender: '', photoUrl: null, medicationName: '', weeklyFact: '', weatherChecked: false },
        cavia: { breed: '', birthDate: '', gender: '', photoUrl: null, medicationName: '', weeklyFact: '', weatherChecked: false },
        reptiel: { breed: '', birthDate: '', gender: '', photoUrl: null, medicationName: '', weeklyFact: '', weatherChecked: false }
      });
      const [activePetType, setActivePetType] = useState(null); 

      // Input details
      const [tempBreed, setTempBreed] = useState('');
      const [tempBirthDate, setTempBirthDate] = useState('');
      const [tempGender, setTempGender] = useState('');
      
      // Gokken / Database State
      const [quizData, setQuizData] = useState({ size: '', coat: '', color: '', feature: '' });
      const [breedSuggestions, setBreedSuggestions] = useState([]);
      const [isGuessing, setIsGuessing] = useState(false);

      // Lokale Content State
      const [generatedHTML, setGeneratedHTML] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);
      
      // Fotostudio & Plakboek
      const [isGeneratingPhoto, setIsGeneratingPhoto] = useState(false);
      const [scrapbook, setScrapbook] = useState([]);
      const [selectedSticker, setSelectedSticker] = useState(null);
      
      // Weer & Chat
      const [weatherPopup, setWeatherPopup] = useState({ show: false, loading: false, html: '', title: '' });
      const [isChatOpen, setIsChatOpen] = useState(false);
      const [chatMessages, setChatMessages] = useState([]);
      const [chatInput, setChatInput] = useState('');
      const [isChatLoading, setIsChatLoading] = useState(false);
      const chatEndRef = useRef(null);

      const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
      const todayVibe = VIBES[dayOfYear % VIBES.length];
      const todayObject = OBJECTS[dayOfYear % OBJECTS.length];

      const activePet = activePetType ? pets[activePetType] : null;
      const petAgeInfo = activePet ? calculateAgeAndDiet(activePetType, activePet.birthDate) : null;
      const config = activePetType ? ANIMAL_CONFIG[activePetType] : null;

      useEffect(() => { if (chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior: "smooth" }); }, [chatMessages, isChatLoading]);

      useEffect(() => {
        if (step === 'pet-dashboard' && activePet) {
          if (!activePet.weeklyFact) generateLocalFact();
          if (!activePet.weatherChecked && !weatherPopup.show) generateLocalWeather();
        }
      }, [step, activePetType]);


      /* --- LOKALE GENERATIE LOGICA (OFFLINE) --- */

      const generateLocalFact = () => {
        const facts = [
          `Wist je dat jouw ${activePet.breed} super gevoelige zintuigen heeft? Ze ruiken en horen dingen die wij niet opmerken! 🌟`,
          `Een ${petAgeInfo?.lifeStage} zoals de jouwe heeft vaste ritmes nodig voor optimale gezondheid. 🐾`,
          `Lichaamstaal is alles! Let maar eens goed op de staart en oren van jouw ${activePetType}. ✨`
        ];
        const fact = facts[Math.floor(Math.random() * facts.length)];
        setPets(prev => ({ ...prev, [activePetType]: { ...prev[activePetType], weeklyFact: fact } }));
      };

      const generateLocalWeather = () => {
        setPets(prev => ({ ...prev, [activePetType]: { ...prev[activePetType], weatherChecked: true } }));
        setWeatherPopup({ show: true, loading: true, html: '', title: '' });
        
        setTimeout(() => {
          const month = new Date().getMonth();
          let temp, tip, activity;

          if (month >= 5 && month <= 7) {
            temp = 25; 
            tip = `Het is flink warm! Voel even aan de grond; als het te heet is voor jouw hand, is het te heet voor de pootjes van je ${activePetType}!`;
            activity = "Bouw een leuke snuffelmat binnen, of speel in de schaduw met water.";
          } else if (month >= 11 || month <= 1) {
            temp = 4; 
            tip = `Brrr, kou en nattigheid. Droog je ${activePetType} goed af als hij/zij naar buiten is geweest, en let op met pekel op de straten!`;
            activity = "Verstop snoepjes in huis voor een leuk hersenwerkje op de bank.";
          } else {
            temp = 16; 
            tip = `Heerlijk weer vandaag. Perfect om lekker te ontdekken en nieuwe luchtjes op te snuiven.`;
            activity = "Probeer vandaag eens een compleet nieuwe route of speel een interactief nieuw spel.";
          }

          setWeatherPopup({
            show: true, loading: false,
            title: `Het is weer voor leuke dingen! 🌤️`,
            html: `
              <h3>📍 Weertip voor je ${activePet.breed}</h3>
              <p><strong>Let op:</strong> ${tip}</p>
              <p><strong>Leuk Idee:</strong> ${activity}</p>
            `
          });
        }, 1500);
      };

      const executeLocalBreedGuess = () => {
        setIsGuessing(true); setErrorMsg(null);
        setTimeout(() => {
          const currentDb = config.db;
          // Simpel lokaal score algoritme gebaseerd op dropdowns
          let scoredBreeds = currentDb.map(breedObj => {
            let score = 0;
            if (quizData.size && breedObj.size === quizData.size) score++;
            if (quizData.coat && breedObj.coat === quizData.coat) score++;
            if (quizData.color && breedObj.color === quizData.color) score++;
            if (quizData.feature && breedObj.feature === quizData.feature) score++;
            return { name: breedObj.name, score };
          });
          
          scoredBreeds.sort((a, b) => b.score - a.score);
          
          // Pak top 3
          let top = scoredBreeds.slice(0, 3).map(b => b.name);
          // Als score 0 is, geef gewoon wat willekeurige suggesties uit de lijst
          if (scoredBreeds[0].score === 0) {
             top = currentDb.slice(0, 3).map(b => b.name).sort(() => 0.5 - Math.random());
          }
          
          setBreedSuggestions(top);
          setIsGuessing(false);
        }, 1000);
      };

      const startLocalHandbookGeneration = () => {
        setStep('generating-handbook'); setIsGenerating(true); setChatMessages([]);
        setTimeout(() => {
          const html = `
            <h2>Anatomie & Verzorging voor de ${activePet.breed}</h2>
            <p>Omdat jouw ${config.label.toLowerCase()} in de <strong>${petAgeInfo?.lifeStage}</strong> fase zit, is de verzorging heel belangrijk! Controleer regelmatig de vacht, nagels en het gebit.</p>
            <div style="border: 3px dashed #f472b6; padding: 1.5rem; text-align: center; border-radius: 1rem; margin: 1.5rem 0; background-color: #fdf2f8; color: #831843;">
              <span style="font-size: 3rem; margin-bottom: 0.5rem; display: block;">🎨 🐾</span>
              <strong style="display:block; margin-bottom: 0.25rem; font-size: 1.2rem;">Borstel & Controle Instructie</strong>
              <em>Neem de tijd om je ${config.label.toLowerCase()} overal te aaien. Borstel zachtjes met de haarrichting mee (of let op de rui!). Beloon altijd met iets lekkers!</em>
            </div>
            <h2>Voeding & Gezondheid</h2>
            <p>Als ${petAgeInfo?.lifeStage} verbruikt je dier energie op zijn eigen manier. Geef liever meerdere kleine beetjes dan één grote bak.</p>
            <blockquote>🧠 <strong>Deep Dive:</strong> Net als mensen hebben dieren een 'Circadiaans ritme' (een interne klok). Zorg voor vaste eettijden en genoeg slaap, dit houdt ze mentaal gezond!</blockquote>
          `;
          setGeneratedHTML(html);
          setStep('handbook');
          setIsGenerating(false);
        }, 2000);
      };

      const startLocalMedicationGeneration = () => {
        setStep('generating-medication'); setIsGenerating(true); setChatMessages([]);
        setTimeout(() => {
          const html = `
            <h2>Wat is ${activePet.medicationName}? 💊</h2>
            <p>Dit is een middel dat soms wordt voorgeschreven voor de ${activePet.breed}. Voor een <strong>${petAgeInfo?.lifeStage}</strong> is een precieze dosering super belangrijk (vraag dit altijd aan je dierenarts!).</p>
            <div style="border: 3px dashed #34d399; padding: 1.5rem; text-align: center; border-radius: 1rem; margin: 1.5rem 0; background-color: #ecfdf5; color: #064e3b;">
              <span style="font-size: 3rem; margin-bottom: 0.5rem; display: block;">🧑‍⚕️ 🐾</span>
              <strong style="display:block; margin-bottom: 0.25rem; font-size: 1.2rem;">Makkelijke Toediening!</strong>
              <em>Zorg voor een rustige sfeer. Verstop een pilletje bijvoorbeeld in wat natvoer, een stukje worst of een speciale pillensnack. Blijf zelf heel relaxed!</em>
            </div>
            <h2>Waar moet je op letten? 🧐</h2>
            <ul>
              <li>Zorg dat er altijd vers water in de buurt is.</li>
              <li>Houd je maatje de eerste paar uurtjes even in de gaten.</li>
              <li>Werkt je dier ineens niet meer mee of wordt hij sloom? Bel dan gewoon even de dierenarts.</li>
            </ul>
          `;
          setGeneratedHTML(html);
          setStep('medication-guide');
          setIsGenerating(false);
        }, 2000);
      };

      // Lokale Chatbot Simulator
      const handleSendLocalChatMessage = (e) => {
        e.preventDefault();
        if (!chatInput.trim() || isChatLoading) return;
        const q = chatInput.toLowerCase();
        setChatMessages(prev => [...prev, { role: 'user', content: chatInput }]);
        setChatInput(''); setIsChatLoading(true);

        setTimeout(() => {
          let answer = "Wat een goede vraag! Zorg altijd dat je goed naar je dier kijkt en bij twijfel je eigen dierenarts belt. 🐾";
          if (q.includes('eten') || q.includes('voer') || q.includes('drink')) answer = `Voor een ${petAgeInfo.lifeStage} is het belangrijk de voeding af te stemmen op het activiteitsniveau. Geef liever meerdere kleine beetjes! 🥣`;
          if (q.includes('spelen') || q.includes('bal') || q.includes('speeltje')) answer = `Spelen is super belangrijk voor de mentale gezondheid van je ${activePet.breed}! Bouw de intensiteit rustig op. 🎾`;
          if (q.includes('ziek') || q.includes('arts') || q.includes('pijn')) answer = "Als je denkt dat je dier ziek is of pijn heeft, raadpleeg dan altijd direct een echte dierenarts! 🩺";
          if (q.includes('medicijn') || q.includes('pil')) answer = "Verstop een pilletje altijd in iets héél lekkers en zorg dat je zelf heel ontspannen bent. Dan trappen ze er het makkelijkst in! 💊";
          
          setChatMessages(prev => [...prev, { role: 'assistant', content: `<p>${answer}</p>` }]);
          setIsChatLoading(false);
        }, 800);
      };

      // Lokale Magische Fotostudio (Canvas manipulatie)
      const generateLocalMagicPhoto = () => {
        if (!activePet.photoUrl) return;
        setIsGeneratingPhoto(true);

        const canvas = document.createElement('canvas');
        canvas.width = 400; canvas.height = 400;
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.onload = () => {
          // Mooie zachte achtergrondkleur
          ctx.fillStyle = config.color === 'sky' ? '#e0f2fe' : (config.color === 'orange' ? '#ffedd5' : '#fdf2f8');

          ctx.beginPath();
          ctx.arc(200, 200, 150, 0, Math.PI * 2);

          // Draw image

          let w = 300, h = 300;
          if(aspect > 1) { w = 300 * aspect; } else { h = 300 / aspect; }
          ctx.drawImage(img, 200 - w/2, 200 - h/2, w, h);
          ctx.restore();

          // Dikke witte sticker rand

          ctx.arc(200, 200, 150, 0, Math.PI * 2);
          ctx.lineWidth = 15;
          ctx.strokeStyle = 'white';
          ctx.stroke();

      const renderInputMedication = () => (
        <div className="animate-in zoom-in-95 duration-500 max-w-md mx-auto text-center">
          <button onClick={() => setStep('pet-dashboard')} className="text-emerald-600 font-bold hover:text-emerald-800 mb-6 flex items-center justify-center gap-2 bg-white px-4 py-2 rounded-full shadow-sm mx-auto">
            <span>←</span> Terug naar Dossier
          </button>
          <div className="text-7xl mb-4">🩺</div>
          <h2 className="text-3xl font-extrabold mb-2 text-slate-700">Medicijn zoeken!</h2>
          <p className="text-slate-500 font-bold mb-6 text-lg">Ik pas de tips speciaal aan voor een <strong className="text-emerald-600">{petAgeInfo?.lifeStage.split(' ')[0]}</strong>!</p>
          
          <div className="flex flex-col space-y-4">
            <input 
              type="text" value={activePet.medicationName} onChange={(e) => setPets(prev => ({ ...prev, [activePetType]: { ...prev[activePetType], medicationName: e.target.value } }))}
              placeholder="Naam van het medicijn..."
              className="w-full p-5 text-xl font-bold border-4 border-emerald-200 rounded-2xl focus:border-emerald-400 outline-none shadow-sm text-slate-700" autoFocus
            />
            <button onClick={startLocalMedicationGeneration} disabled={activePet.medicationName.trim().length < 2} className="w-full py-5 bg-emerald-500 text-white text-2xl font-extrabold rounded-2xl hover:shadow-lg hover:bg-emerald-600 hover:scale-[1.02] disabled:opacity-50 transition-all">
              Vind Info! 🔍
            </button>
          </div>
        </div>
      );

      const renderGenerating = (title, subtitle, emoji) => (
        <div className="flex flex-col items-center justify-center py-24 text-center animate-in fade-in zoom-in-95 duration-700 relative z-10">
          <div className="text-8xl animate-bounce mb-6 drop-shadow-md">{emoji}</div>
          <h2 className="text-4xl font-extrabold text-slate-800 mb-4 tracking-tight">{title}</h2>
          <p className="text-slate-600 font-bold text-xl max-w-md bg-white p-5 rounded-3xl shadow-sm border-4 border-slate-100">{subtitle}</p>
        </div>
      );

      const renderContentDisplay = (title, subtitle, bgColor) => (
        <div className="animate-in fade-in slide-in-from-bottom-8 duration-700 pb-32 max-w-4xl mx-auto">
           <div className={`flex flex-col sm:flex-row justify-between items-center mb-8 p-6 rounded-3xl border-4 ${bgColor} shadow-sm gap-4`}>
            <div className="text-center sm:text-left">
              <h2 className="text-3xl font-extrabold text-slate-800 mb-1">{title}</h2>
              <p className="text-slate-600 font-bold text-lg">{subtitle} • <span className="font-extrabold text-slate-800 bg-white px-2 py-1 rounded-lg ml-1">{petAgeInfo?.lifeStage}</span></p>
            </div>
            <button onClick={() => { setStep('pet-dashboard'); setIsChatOpen(false); }} className="px-6 py-4 bg-white hover:bg-slate-50 text-slate-700 rounded-full font-extrabold shadow-sm border-2 border-transparent hover:border-slate-300 transition-all text-lg">
              Terug naar Dossier 📂
            </button>
          </div>
          
          <div 
            className="bg-white p-8 md:p-12 rounded-[2rem] shadow-sm border-4 border-slate-100 prose prose-slate max-w-none prose-headings:font-extrabold prose-h2:text-4xl prose-h2:mt-14 prose-h2:text-sky-800 prose-h2:border-b-4 prose-h2:border-sky-200 prose-h2:pb-4 prose-h3:text-3xl prose-h3:text-orange-600 prose-p:text-xl prose-p:leading-relaxed prose-p:font-bold prose-p:text-slate-700 prose-a:text-pink-500 prose-a:font-extrabold prose-a:underline-offset-4 prose-blockquote:border-l-8 prose-blockquote:border-pink-400 prose-blockquote:bg-pink-50 prose-blockquote:py-6 prose-blockquote:px-8 prose-blockquote:rounded-r-3xl prose-blockquote:not-italic prose-blockquote:text-pink-900 prose-li:my-3 prose-li:text-xl prose-li:font-bold prose-strong:text-slate-900"
            dangerouslySetInnerHTML={{ __html: generatedHTML }}
          />
          
          {/* Chat Widget integrated locally */}
          <div className="fixed bottom-6 right-6 z-50 flex flex-col items-end">
            {isChatOpen && (
              <div className="bg-white rounded-[2rem] shadow-2xl border-4 border-sky-200 w-80 sm:w-96 mb-4 flex flex-col overflow-hidden animate-in slide-in-from-bottom-8 duration-300" style={{ height: '550px', maxHeight: '75vh' }}>
                <div className="bg-gradient-to-r from-sky-400 to-blue-500 text-white p-5 flex justify-between items-center shadow-md z-10">
                  <div>
                    <h3 className="font-extrabold flex items-center gap-2 text-xl">
                      <IconChat /> Jouw Vrolijke Hulp!
                    </h3>
                    <p className="text-sm text-sky-100 font-bold mt-1">Lokaal geholpen! 🐾</p>
                  </div>
                  <button onClick={() => setIsChatOpen(false)} className="text-sky-100 hover:text-white bg-white/20 p-2 rounded-full transition-colors"><IconClose /></button>
                </div>
                <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50 text-base">
                  {chatMessages.length === 0 && (
                    <div className="text-center text-slate-500 mt-10 flex flex-col items-center">
                      <span className="text-6xl mb-4">👋</span>
                      <p className="font-extrabold px-4 text-lg">Hoi! Typ 'eten', 'spelen', 'ziek' of 'medicijn' voor lokaal advies!</p>
                    </div>
                  )}
                  {chatMessages.map((msg, idx) => (
                    <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                      {msg.role === 'assistant' ? (
                         <div 
                           className="max-w-[85%] p-4 rounded-2xl shadow-sm bg-white border-2 border-slate-200 text-slate-700 rounded-bl-none prose prose-sm prose-a:text-sky-600 prose-a:font-bold break-words font-medium"
                           dangerouslySetInnerHTML={{ __html: msg.content }} 
                         />
                      ) : (
                         <div className="max-w-[85%] p-4 rounded-2xl shadow-sm bg-sky-500 text-white rounded-br-none font-bold text-base">
                           {msg.content}
                         </div>
                      )}
                    </div>
                  ))}
                  {isChatLoading && (
                    <div className="flex justify-start text-sky-500 p-4 bg-white border-2 border-slate-200 rounded-2xl rounded-bl-none w-20 shadow-sm">
                       <span className="animate-pulse font-extrabold text-2xl">...</span>
                    </div>
                  )}
                  <div ref={chatEndRef} />
                </div>
                <form onSubmit={handleSendLocalChatMessage} className="p-3 bg-white border-t-4 border-slate-100 flex gap-2 z-10">
                  <input type="text" value={chatInput} onChange={(e) => setChatInput(e.target.value)} placeholder="Typ je vraag..." className="flex-1 px-4 py-3 bg-slate-100 border-2 border-transparent rounded-xl outline-none focus:border-sky-400 font-bold text-slate-700" disabled={isChatLoading} />
                  <button type="submit" disabled={!chatInput.trim() || isChatLoading} className="px-6 py-3 bg-sky-500 hover:bg-sky-600 text-white rounded-xl font-extrabold disabled:opacity-50 transition-colors text-lg">Zend</button>
                </form>
              </div>
            )}
            {!isChatOpen && (
              <button onClick={() => setIsChatOpen(true)} className={`bg-sky-500 hover:bg-sky-600 text-white p-5 rounded-full shadow-xl transition-all hover:scale-110 flex items-center gap-3 border-4 border-white`}>
                <IconChat />
                <span className="font-extrabold text-xl pr-2">Stel een Vraag! 🙋‍♀️</span>
              </button>
            )}
          </div>
        </div>
      );

      const renderShareModal = () => {
        if (!selectedSticker) return null;
        const shareText = encodeURIComponent(`Kijk eens wat een magische sticker ik heb gemaakt voor mijn huisdier! 🐾 Gemaakt op ${selectedSticker.date}.`);
        return (
          <div className="fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/60 backdrop-blur-md p-4 animate-in fade-in">
            <div className="bg-white rounded-[3rem] shadow-2xl p-8 max-w-sm w-full relative flex flex-col items-center">
              <button onClick={() => setSelectedSticker(null)} className="absolute top-4 right-4 bg-slate-100 p-2 rounded-full text-slate-500 hover:text-slate-800"><IconClose /></button>
              <img src={selectedSticker.src} className="w-64 h-64 object-contain drop-shadow-xl mb-6" />
              <h3 className="text-2xl font-extrabold text-slate-800 mb-2">{selectedSticker.title}</h3>
              <p className="text-slate-500 font-bold text-sm mb-8 bg-slate-100 px-4 py-1 rounded-full">Behaald op: {selectedSticker.date}</p>
              
              <div className="w-full space-y-3">
                <a href={`https://wa.me/?text=${shareText}`} target="_blank" rel="noreferrer" className="flex items-center justify-center gap-3 w-full py-4 bg-[#25D366] hover:bg-[#1EBE5D] text-white rounded-2xl font-extrabold text-lg transition-transform hover:scale-105 shadow-md">
                  📱 Deel via WhatsApp
                </a>
                <a href={`https://www.facebook.com/sharer/sharer.php?u=https://example.com`} target="_blank" rel="noreferrer" className="flex items-center justify-center gap-3 w-full py-4 bg-[#1877F2] hover:bg-[#166FE5] text-white rounded-2xl font-extrabold text-lg transition-transform hover:scale-105 shadow-md">
                  📘 Deel op Facebook
                </a>
              </div>
            </div>
          </div>
        );
      };

      const renderWeatherPopup = () => {
        if (!weatherPopup.show) return null;
        return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm animate-in fade-in duration-300 p-4">
          <div className="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-lg overflow-hidden flex flex-col border border-white">
            <div className="bg-white p-4 flex justify-between items-center text-slate-800 border-b border-slate-100">
              <h3 className="font-extrabold text-xl flex items-center gap-2">🌤️ Weer & Advies Check!</h3>
              <button onClick={() => setWeatherPopup(prev => ({ ...prev, show: false }))} className="bg-slate-100 p-2 rounded-full hover:bg-slate-200 transition-colors"><IconClose /></button>
            </div>
            <div className="p-8 bg-slate-50">
              {weatherPopup.loading ? (
                <div className="text-center py-10 flex flex-col items-center">
                  <span className="text-7xl animate-bounce mb-6 block">⛅</span>
                  <p className="text-slate-800 font-extrabold text-2xl animate-pulse mb-2">Lokaal kijken hoe het weer is... 🐾</p>
                </div>
              ) : (
                <div className="animate-in zoom-in-95">
                  <h4 className="text-2xl font-extrabold text-slate-800 mb-6">{weatherPopup.title}</h4>
                  <div className="prose prose-sm max-w-none prose-p:font-medium prose-p:text-slate-600 prose-p:text-lg prose-h3:text-slate-800 prose-h3:mb-3 prose-h3:font-extrabold prose-h3:text-2xl prose-strong:text-slate-800 bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100" dangerouslySetInnerHTML={{ __html: weatherPopup.html }} />
                  <button onClick={() => setWeatherPopup(prev => ({ ...prev, show: false }))} className="mt-6 w-full py-4 bg-slate-900 text-white font-extrabold text-xl rounded-2xl shadow-md transition-transform hover:scale-105">
                    Klinkt super! 🚀
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
        );
      };

      return (
        <div className="relative z-10">
          {(!['handbook', 'medication-guide'].includes(step)) && renderHeader()}
          
          <main>
            {step === 'home' && renderHome()}
            {step === 'know-breed' && renderKnowBreed()}
            {step === 'input-breed' && renderInputBreed()}
            {step === 'guess-breed' && renderGuessBreed()}
            {step === 'input-details' && renderInputDetails()}
            {step === 'pet-dashboard' && renderPetDashboard()}
            
            {step === 'generating-handbook' && renderGenerating('Boekje wordt getekend...', `Ik zoek lokaal de allerleukste en beste tips speciaal voor een ${petAgeInfo?.lifeStage.split(' ')[0]} ${activePet.breed}!`, '✍️')}
            {step === 'generating-medication' && renderGenerating('Dokterstas wordt gepakt...', `Super simpele uitleg voor ${activePet.medicationName} lokaal ophalen.`, '🩺')}
            
            {step === 'handbook' && renderContentDisplay(`📖 Encyclopedie: ${activePet.breed}`, "Gezellig Verzorgingsboekje", "bg-sky-100 border-sky-300")}
            {step === 'medication-guide' && renderContentDisplay(`💊 ${activePet.medicationName}`, `Makkelijke EHBO Uitleg voor de ${activePet.breed}`, "bg-emerald-100 border-emerald-300")}
            {step === 'input-medication' && renderInputMedication()}
          </main>

          {renderWeatherPopup()}
          {renderShareModal()}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
